{"name": "Publier un Reel", "on": {"schedule": [{"cron": "30 17 * * *"}], "workflow_dispatch": {"inputs": {"dry_run": {"description": "Test sans publier", "default": "false"}}}}, "permissions": {"contents": "write"}, "concurrency": "reels", "jobs": {"publish": {"runs-on": "ubuntu-latest", "timeout-minutes": 60, "steps": [{"uses": "actions/checkout@v4", "with": {"ref": "main"}}, {"run": "pip install requests"}, {"name": "Publier", "env": {"IG_ACCESS_TOKEN": "${{ secrets.IG_ACCESS_TOKEN }}", "DROPBOX_FOLDER_URL": "${{ secrets.DROPBOX_FOLDER_URL }}", "DRY_RUN": "${{ github.event.inputs.dry_run || 'false' }}"}, "run": "python publish.py"}, {"name": "Enregistrer etat", "if": "${{ github.event.inputs.dry_run != 'true' }}", "run": "git config user.name reels-bot\ngit config user.email reels-bot@users.noreply.github.com\ngit add state.json\ngit diff --cached --quiet || (git commit -m state && git push origin main)\n"}]}}}
